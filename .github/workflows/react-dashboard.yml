name: React Dashboard

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  frontend:
    name: lint, unit tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm run test
      - name: Build
        run: npm run build

  end-to-end:
    name: end-to-end tests (real browser, real API)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-api.txt
      - name: Install the API requirements
        run: python -m pip install -r backend/requirements-api.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run the browser tests (uses the Chrome installed on the runner)
        working-directory: frontend
        env:
          E2E_PYTHON: python
          E2E_BENCHMARK_RUN_DIR: ${{ github.workspace }}/backend/docs/results/benchmark_v2_methods_2026-10-25
        run: npm run e2e
