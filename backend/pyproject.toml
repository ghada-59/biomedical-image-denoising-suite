[project]
name = "biomedical-image-denoising-api"
version = "0.1.0"
description = "FastAPI runtime dependencies for the Biomedical Image Denoising Suite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1",
    "python-multipart>=0.0.12,<1",
    "numpy>=1.24.0,<3",
    "opencv-python-headless>=4.8.0,<5",
    "scikit-image>=0.21.0,<1",
    "pillow>=10.0.0,<14",
    "pandas>=2.0.0,<4",
    "scipy>=1.10.0,<2",
    "PyWavelets>=1.6.0,<2",
    "pydicom>=2.4.0,<4",
    "plotly>=5.18,<7",
]

[tool.vercel]
entrypoint = "api:app"
