# Static checks: pyflakes-class errors (F), syntax/runtime-class errors (E4, E7, E9).
# Run from backend/:  python -m pip install "ruff==0.17.2"  &&  ruff check .
target-version = "py310"
extend-exclude = ["data", "reports", "outputs"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Test files use compact one-line helpers on purpose.
"test_*.py" = ["E702", "E731"]
